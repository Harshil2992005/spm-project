services:
  - type: web
    name: spm-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OTP_DEBUG
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "harshilpatel2992005@gmail.com"
      - key: SMTP_PASSWORD
        value: "gmpogeprcadhugpl"
      - key: SMTP_FROM
        value: "harshilpatel2992005@gmail.com"
